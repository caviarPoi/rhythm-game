t||1),v=Math.max(0,Math.min(1,f))*r,k=Math.min(r-1,Math.floor(v)),u=v-k;if(k%2)u=1-u;let lens=pts.slice(1).map((p,i)=>Math.hypot(p.x-pts[i].x,p.y-pts[i].y)),dist=u*lens.reduce((a,b)=>a+b,0);for(let i=0;i<lens.length;i++){if(dist<=lens[i]||i===lens.length-1){let q=lens[i]?Math.min(1,dist/lens[i]):0;return {x:pts[i].x+(pts[i+1].x-pts[i].x)*q,y:pts[i].y+(pts[i+1].y-pts[i].y)*q}}dist-=lens[i]}return pts[0]}function strokeRoute(g,n,c,w){let pts=route(n);g.beginPath();g.moveTo(pts[0].x,pts[0].y);for(let p of pts.slice(1))g.lineTo(p.x,p.y);g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.stroke()}function target(n,t){return n.type==='slide'?pathTarget(n,(t-n.t)/(n.end-n.t)):{x:n.x,y:n.y}}\nfunction down(id,p){if(!running||fingers.has(id))return;fingers.set(id,p);let t=now();let n=notes.filter(n=>!n.done&&n.owner===null&&Math.abs(t-n.t)<=.18&&Math.hypot(p.x-n.x,p.y-n.y)<=R+12).sort((a,b)=>Math.abs(a.t-t)-Math.abs(b.t-t))[0];if(!n)return;let d=t-n.t,q=grade(d);if(q==='MISS'||n.type==='tap'){judge(n,q,d);return}n.owner=id;n.delta=d;n.q=q;n.last=t;}\nfunction up(id){if(!running)return;let t=now();for(let n of notes)if(!n.done&&n.owner===id){if(t>=n.end-.075&&n.bad<=.12)judge(n,n.q,n.delta);else judge(n,'MISS',t-n.end,'提前松手')}fingers.delete(id)}\nfunction move(id,p){if(fingers.has(id))fingers.set(id,p)}\nfunction tick(t){for(let n of notes){if(n.done)continue;if(n.owner===null){if(t>n.t+.18)judge(n,'MISS',null,'漏键');continue}let p=fingers.get(n.owner),q=target(n,t);let dt=Math.max(0,Math.min(.05,t-n.last));n.last=t;if(!p||Math.hypot(p.x-q.x,p.y-q.y)>R+24)n.bad+=dt;else n.bad=Math.max(0,n.bad-dt*2);if(n.bad>.12)judge(n,'MISS',null,'脱离轨迹');else if(t>=n.end)judge(n,n.q,n.delta)}}\nfunction circle(x,y,r,color,w=2,fill=null){g.beginPath();g.arc(x,y,r,0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill()}g.strokeStyle=color;g.lineWidth=w;g.stroke()}\nfunction line(x,y,ex,ey,color,w){g.beginPath();g.moveTo(x,y);g.lineTo(ex,ey);g.strokeStyle=color;g.lineWidth=w;g.lineCap= function simplifyRec(pts,eps=5){if(pts.length<=2)return pts;let a=pts[0],b=pts.at(-1),dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy,best=0,index=0;for(let i=1;i<pts.length-1;i++){let p=pts[i],q=l?clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l,0,1):0,d=Math.hypot(p.x-a.x-q*dx,p.y-a.y-q*dy);if(d>best){best=d;index=i}}if(best<=eps)return [a,b];return simplifyRec(pts.slice(0,index+1),eps).slice(0,-1).concat(simplifyRec(pts.slice(index),eps))}
function recordTime(t){let v=Math.max(0,t-recConfig.offset/1000);return recConfig.snap?quant(v):round(v)}
function recNote(r,end){let pts=r.points,elapsed=Math.max(0,end-r.t),travel=pts.reduce((m,p)=>Math.max(m,dist(p,pts[0])),0),type=recConfig.type;if(type==='auto')type=travel>=45&&elapsed>=.08?'slide':elapsed>=.22?'hold':'tap';let t=recordTime(r.t),e=type==='tap'?t:Math.max(t+.05,recordTime(end));if(type!=='tap'&&recConfig.snap&&e<=t+.050001)e=Math.max(t+.05,quant(t+step(t)));if(Number.isFinite(audio.duration)){t=Math.min(t,audio.duration);e=Math.min(e,audio.duration)}if(type!=='tap'&&e-t<.045){type='tap';e=t}let p=pts[0],q=p,path=[];if(type==='slide'){let reduced=simplifyRec(pts);q=reduced.at(-1);path=reduced.slice(1,-1).map(v=>({x:round(v.x),y:round(v.y)}));if(travel<8){type='hold';q=p;path=[]}}return {t:round(t),end:round(e),type,x:round(p.x),y:round(p.y),ex:round(q.x),ey:round(q.y),path,repeat:1,curve:'poly'}}
function recFinish(id,end,p){let r=recPointers.get(id);if(!r)return;recPointers.delete(id);if(p&&dist(r.points.at(-1),p)>1)r.points.push(p);let n=recNote(r,end);notes.push(n);recAdded.push(n);recEffects.push({x:n.x,y:n.y,t:performance.now(),type:n.type});normalize();$('count').textContent=notes.length;$('recInfo').textContent='录制中 · 已生成 '+recAdded.length+' 个音符 · '+recPointers.size+' 指按下'}
function recUI(active){document.body.classList.toggle('recording',active);$('recStart').disabled=active;$('recStop').disabled=!active;for(let id of ['recType','recSnap','recOffset','recQuant','rate','seek','bpm','offset','snap','preview'])$(id).disabled=active;document.querySelector('header').inert=active;document.querySelector('aside').inert=active;timeline.style.pointerEvents=active?'none':''}
async function startRec(){if(recActive||recStarting)return;if(!file||!Number.isFinite(audio.duration)){msg('请先导入音乐并等待音频载入');return}if(playing)originalPause();if(cursor>=audio.duration-.02){originalSeek(0)}pending=null;box=null;drag=null;recStarting=true;recBefore=snapshot();recAdded=[];recEffects=[];recPointers.clear();recConfig={type:$('recType').value,snap:$('recSnap').value==='grid',offset:clamp(+$('recOffset').value||0,-500,500)};recUI(true);$('recStop').disabled=true;try{await toggle();if(!playing)throw Error('音乐未开始播放');recActive=true;$('recStop').disabled=false;$('recInfo').textContent='录制中 · 点击、长按或拖动；Space 停止';msg('录制中，所有手势将追加到当前谱面')}catch(e){recUI(false);msg('无法录制：'+e.message)}finally{recStarting=false}}
function stopRec(){if(!recActive)return;let t=recTime();for(let id of [...recPointers.keys()])recFinish(id,t);recActive=false;originalPause();recUI(false);if(recAdded.length){history.push(recBefore);if(history.length>150)history.shift();future=[];multi.clear();for(let n of recAdded)multi.add(n);selected=recAdded.at(-1);originalSeek(selected.t);refresh()}$('recInfo').textContent='录制完成 · 新增 '+recAdded.length+' 个音符。已选中，可吸附、镜像、删除或撤销。';msg('录制结束；Ctrl+Z 可撤销整次录制')}
pause=function(){if(recActive){stopRec();return}originalPause()};audio.onended=pause;
seek=function(t){if(!recActive&&!recStarting)originalSeek(t)};
field.onpointerdown=e=>{if(!recActive){if(!recStarting)originalDown(e);return}e.preventDefault();if(e.button!==0||recPointers.has(e.pointerId)||recPointers.size>=2)return;let p=recPoint(e);recPointers.set(e.pointerId,{t:recTime(),points:[p]});field.setPointerCapture(e.pointerId)};
field.onpointermove=e=>{if(!recActive){if(!recStarting)originalMove(e);return}let r=recPointers.get(e.pointerId);if(!r)return;let p=recPoint(e);if(dist(r.points.at(-1),p)>=3)r.points.push(p)};
field.onpointerup=e=>{if(!recActive){if(!recStarting)originalUp(e);return}recFinish(e.pointerId,recTime(),recPoint(e))};
field.onpointercancel=e=>{if(!recActive){if(!recStarting)originalCancel(e);return}recFinish(e.pointerId,recTime())};field.addEventListener('lostpointercapture',e=>{if(recActive)recFinish(e.pointerId,recTime())});
window.addEventListener('blur',()=>{if(recActive)stopRec()});
document.addEventListener('keydown',e=>{if(!recActive&&!recStarting)return;if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)&&e.code!=='Space'&&e.key!=='Escape')return;e.stopImmediatePropagation();e.preventDefault();if(recActive&&(e.code==='Space'||e.key==='Escape'))stopRec()},true);
function quantRecorded(){if(recActive||recStarting)return;let a=group();if(!a.length){msg('请先选择需要吸附的音符');return}if(!+$('snap').value){msg('请先设置节拍吸附');return}checkpoint();for(let n of a){let t=quant(n.t),e=quant(n.end);n.t=t;n.end=n.type==='tap'?t:Math.max(t+.05,e>t?e:quant(t+step(t)))}refresh();msg('已吸附 '+a.length+' 个选中音符的起止时间')}
function drawRec(t){if(!recActive)return;let now=performance.now();recEffects=recEffects.filter(e=>now-e.t<500);for(let e of recEffects){let f=(now-e.t)/500;g.globalAlpha=1-f;circle(e.x,e.y,36+f*30,colors[e.type]);g.fillStyle=colors[e.type];g.font='bold 18px system-ui';g.textAlign='center';g.fillText(e.type.toUpperCase(),e.x,e.y-45-f*20);g.globalAlpha=1}for(let r of recPointers.values()){let a=r.points,p=a.at(-1);for(let i=1;i<a.length;i++)line(a[i-1].x,a[i-1].y,a[i].x,a[i].y,'#eaa0ff',5);circle(p.x,p.y,36,'#ff8da4','#61364a');g.fillStyle='#fff';g.font='bold 17px system-ui';g.textAlign='center';g.fillText(Math.max(0,t-r.t).toFixed(2)+'s',p.x,p.y+5)}g.fillStyle='#ef7791';g.font='bold 20px system-ui';g.textAlign='left';g.fillText('● REC  '+recAdded.length,15,28)}
</script>
