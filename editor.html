<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>PULSE / STUDIO</title><link rel="stylesheet" href="style.css"><body class="editor"><header><button id="mobileTools" onclick="document.body.classList.toggle('toolsOpen')">工具 / 属性</button><strong>PULSE / STUDIO</strong><button onclick="$('audioFile').click()">导入音乐</button><button onclick="$('jsonFile').click()">导入谱面</button><button onclick="save()">导出 JSON</button><button onclick="test()">试玩谱面</button><button onclick="undo()">撤销 Ctrl+Z</button><button onclick="redo()">重做</button><input hidden type=file id=audioFile><input hidden type=file id=jsonFile accept=".json"></header><main><section><div class=row><button id=play onclick="toggle()">播放 / 暂停 Space</button><button onclick="seek(0)">回到开头</button><button onclick="seek(time()-step())">上一格</button><button onclick="seek(time()+step())">下一格</button><label>速度 <select id=rate><option>.5</option><option>.75</option><option selected>1</option></select></label><label><input id=preview type=checkbox>自动演示</label><span id=clock></span><span class="gridbar"><label><input type="checkbox" id="grid" checked> 网格吸附 · 60px</label><button onclick="location.href='index.html'">选曲</button></span></div><input id=seek type=range min=0 max=120 step=.001 value=0><div id="recPanel"><div class="row"><b>录制编辑</b><button id="recStart" onclick="startRec()">● 开始录制</button><button id="recStop" onclick="stopRec()" disabled>■ 停止</button><button id="recSettings" onclick="document.body.classList.toggle('recOptions')">录制设置</button><div id="recOptions"> <label>识别 <select id="recType"><option value="auto">自动</option><option value="tap">仅单点</option><option value="hold">仅长按</option><option value="slide">仅滑动</option></select></label><label>时间 <select id="recSnap"><option value="raw">原始时间</option><option value="grid" selected>节拍吸附</option></select></label><label>补偿(ms)<input id="recOffset" type="number" value="0" min="-500" max="500" step="5"></label><label><input id="recExisting" type="checkbox">显示旧音符</label><button id="recQuant" onclick="quantRecorded()">选中音符吸附</button></div></div><span id="recInfo">从当前时间开始追加录制；点击、按住、拖动自动识别。支持双指；停止后选中本次音符。</span></div><div id=fieldWrap><canvas id=field width=960 height=540></canvas></div><canvas id=timeline width=1600 height=220></canvas></section><aside><button id="closeTools" onclick="document.body.classList.remove('toolsOpen')">返回画布</button><h3>歌曲 / 节拍</h3><div class=row><label>曲名 <input id=title value="Untitled" type=text></label><label>BPM <input id=bpm type=number min=1 value=120></label><label>首拍(ms) <input id=offset type=number value=0></label><label>难度 <select id=diff><option>NORMAL</option><option>HARD</option></select></label><label>吸附 <select id=snap><option value=1>1/4</option><option value=2 selected>1/8</option><option value=3>1/12</option><option value=4>1/16</option><option value=8>1/32</option><option value=0>关闭</option></select></label></div><h3>波形</h3><div class=row><b>时间轴 / 波形</b><label>增益 <input id=gain type=range min=1 max=8 step=.5 value=2></label><label><input type=checkbox id=onsets checked>瞬态</label></div><div class=row><label>显示范围 <select id=zoom><option>1</option><option>2</option><option selected>4</option><option>8</option><option>16</option><option>32</option></select>秒</label><span>点击时间轴定位；滚轮移动时间。</span></div><h3>节奏分析</h3><button onclick="detect()">自动识别 BPM / 首拍</button><div id=analysisStatus></div><div class=row><input id=newBpm type=number min=20 max=400 value=120><button onclick="addTempo()">当前时间加变速点</button></div><div id=tempos></div><h3>音符工具</h3><div class=row id=tools><button data-type=select>选择 V</button><button data-type=tap class=active>单点 1</button><button data-type=hold>长按 2</button><button data-type=slide>直线 3</button><button data-type=poly>折线 4</button><button data-type=curve>曲线 5</button><button data-type=box>框选 B</button></div><label>持续拍数 <input id=len type=number min=.125 step=.125 value=2></label><label>滑条段数 <input id=repeatCount type=number min=1 max=16 value=1></label><button onclick="finishPath()">完成滑条 Enter</button><small>折线/曲线：依次点击节点，Enter 完成。往返次数为2即去回。</small><h3>当前音符</h3><div id=props></div><div class=row><button onclick="duplicate()">复制到下一格</button><button onclick="copyGroup()">复制 Ctrl+C</button><button onclick="pasteGroup()">粘贴 Ctrl+V</button><button onclick="mirror('x')">水平镜像</button><button onclick="mirror('y')">垂直镜像</button><button onclick="remove()">删除 Del</button></div><h3>音符列表 <span id=count></span></h3><div id=list></div><p id=warnings></p></aside></main><footer><span id=status>请导入音乐，设置 BPM 和首拍，然后开始制谱。</span></footer><script src="common.js"></script><script src="editor.js"></script></body></html>
