<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>PULSE / BUBBLE</title><link rel="stylesheet" href="style.css"></head><body class="player"><main>
<section id="menu"><header class="brand">PULSE <i>/</i> BUBBLE <span class="edition">LANDSCAPE EDITION</span><a href="editor.html">STUDIO ↗</a></header><div class="menuBody"><div class="trackDetail"><div class="album" id="album"></div><div class="trackMeta" id="trackMeta"><small>SELECTED TRACK</small><h1 id="songTitle"></h1><p id="songDesc"></p><p id="info"></p></div><div class="difficulty row"><button id="easy" onclick="difficulty=0;renderMenu()">NORMAL</button><button id="hard" onclick="difficulty=1;renderMenu()">HARD</button></div><button class="primary playButton" onclick="start()">PLAY <span>››</span></button></div><div class="library"><div class="libraryHead"><span>TRACK LIST</span><small id="trackCount"></small></div><div class="songs" id="songs"></div><div class="importRow"><label class="fileButton">＋ 谱面<input type="file" id="customJson" accept=".json"></label><label class="fileButton">＋ 音乐<input type="file" id="customAudio"></label><small id="customStatus"></small></div></div></div><footer class="menuSettings"><label>预览 <select id="speed"><option value="1.8">慢</option><option value="1.25" selected>标准</option><option value=".85">快</option></select></label><label>音量 <input id="volume" type="range" min="0" max="100" value="50"></label><label>补偿(ms) <input id="offset" type="number" value="0" min="-300" max="300"></label><small>TOUCH × 2 / Z · X</small></footer></section>
<section id="game" class="hide"><div class="gameHud"><div><small id="track"></small><strong id="score">0000000</strong></div><div><small>COMBO</small><strong id="combo">0</strong></div><div><small>ACCURACY</small><strong id="accuracy">100.00%</strong></div><div><small>TIME</small><strong id="time">0:00</strong></div><button onclick="abort()">退出</button></div><div class="bar"><i id="progress"></i></div><canvas id="field" width="960" height="540"></canvas></section>
<section id="result" class="hide"><header class="brand">PULSE <i>/</i> BUBBLE <span class="edition">RESULT / 游玩结束</span></header><div class="resultBody"><div class="resultHero"><small>FINAL SCORE</small><div class="big" id="finalScore"></div><h1 id="resultTitle"></h1><div id="rank"></div></div><div class="resultDetail"><p id="summary"></p><div class="results" id="counts"></div><p id="timing"></p><div class="row"><button class="primary" onclick="start()">再玩一次</button><button onclick="show('menu')">返回选曲</button></div></div></div></section></main><script src="common.js"></script><script src="game.js"></script></body></html>
