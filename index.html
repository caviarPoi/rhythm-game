<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Pulse Bubble</title><link rel="stylesheet" href="style.css"><body class="player"><main>
<section id="menu"><div class="row"><label>自定义谱面 <input type="file" id="customJson" accept=".json"></label><label>对应音乐 <input type="file" id="customAudio" ></label></div><p id="customStatus"></p><div class="brand">PULSE <i>/</i> BUBBLE <a href="editor.html">STUDIO ↗</a></div><small>TOUCH RHYTHM / TWO FINGERS</small><h1>SELECT<br>TRACK<span>.</span></h1><p>泡泡节奏 · 单点 / 长按 / 滑动 / 双押</p><div class="songs" id="songs"></div><div class="row"><button id="easy" onclick="difficulty=0;renderMenu()">NORMAL</button><button id="hard" onclick="difficulty=1;renderMenu()">HARD</button></div><p id="info"></p><div class="row"><label>预览时间 <select id="speed"><option value="1.8">慢</option><option value="1.25" selected>标准</option><option value=".85">快</option></select></label><label>音量 <input id="volume" type="range" min="0" max="100" value="50"></label><label>补偿(ms) <input id="offset" type="number" value="0" min="-300" max="300" style="width:75px"></label></div><p>推荐手机或平板横屏，双指同时操作。电脑可用鼠标移动，按 Z/X 模拟两个独立按键（各自在按下时的位置锁定，滑动跟随鼠标）。</p><button class="primary" onclick="start()">开始游戏</button></section>
<section id="game" class="hide"><div class="row between"><small id="track"></small><button onclick="abort()">退出 Esc</button></div><div class="stats"><div><small>SCORE</small><strong id="score">0000000</strong></div><div><small>COMBO</small><strong id="combo">0</strong></div><div><small>TIME</small><strong id="time">0:00</strong></div></div><div class="bar"><i id="progress"></i></div><canvas id="field" width="960" height="540"></canvas><p>外圈收缩至泡泡边缘时点击 · 长按保持 · 滑动跟随光点 · 同时出现的双押有连线</p></section>
<section id="result" class="hide"><small>RESULT / 游玩结束</small><h1 id="resultTitle"></h1><div class="panel"><small>FINAL SCORE</small><div class="big" id="finalScore"></div><div id="rank"></div><p id="summary"></p><div class="results" id="counts"></div><p id="timing"></p></div><div class="row" style="margin-top:20px"><button class="primary" onclick="start()">再玩一次</button><button onclick="show('menu')">返回选歌</button></div></section></main><script src="common.js"></script><script src="game.js"></script></body></html>
